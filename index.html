<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ගණිත ධාවකයා - ගිනි කඳු ලෝකය</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #2E0000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; touch-action: none; }
        
        #ui { position: absolute; top: 20px; width: 100%; text-align: center; pointer-events: none; z-index: 10; display: none; }
        #question { 
            font-size: 45px; font-weight: bold; color: #fff; 
            background: rgba(40, 0, 0, 0.85); padding: 15px 40px; 
            border-radius: 20px; display: inline-block; 
            border: 4px solid #FF5500; box-shadow: 0 0 20px rgba(255, 85, 0, 0.8);
            transition: transform 0.2s;
        }
        #scoreBox { 
            position: absolute; top: 20px; left: 30px; 
            font-size: 30px; font-weight: bold; color: #FFD700; 
            background: rgba(40, 0, 0, 0.85); padding: 10px 25px; 
            border-radius: 15px; border: 2px solid #FF5500;
            transition: transform 0.1s;
        }
        
        /* සාමාන්‍ය ලකුණු වලට අමතරව එකතු කළ මුළු කාසි පෙන්වීම */
        #coinBox {
            position: absolute; top: 20px; right: 30px; 
            font-size: 30px; font-weight: bold; color: #FFD700; 
            background: rgba(0, 0, 0, 0.8); padding: 10px 25px; 
            border-radius: 15px; border: 2px solid #FFD700;
        }

        #startScreen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(80, 0, 0, 0.95), rgba(20, 0, 0, 0.95));
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: white; z-index: 30;
        }
        #startScreen h1 { font-size: 65px; margin: 0; text-shadow: 3px 3px 10px #FF5500; text-align: center; color: #FFD700; }
        #startScreen p { font-size: 24px; margin: 10px 0 20px 0; text-shadow: 2px 2px 4px #000; text-align: center; }
        
        .coin-display { font-size: 28px; color: #FFD700; margin-bottom: 30px; font-weight: bold; background: rgba(0,0,0,0.5); padding: 10px 20px; border-radius: 10px; border: 1px solid #FFD700;}
        
        #playButton {
            padding: 15px 50px; font-size: 32px; font-weight: bold;
            color: #fff; background-color: #D84315; border: 3px solid #FFF; border-radius: 40px;
            cursor: pointer; box-shadow: 0 5px 25px rgba(216, 67, 21, 0.6); transition: transform 0.2s;
        }
        #playButton:hover { transform: scale(1.1); background-color: #FF5722; }

        #gameOverOverlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(150, 0, 0, 0.9); display: none;
            flex-direction: column; justify-content: center; align-items: center;
            color: white; z-index: 20;
        }
        #gameOverOverlay h1 { font-size: 80px; margin: 0; text-shadow: 3px 3px 6px #000; text-align: center; }
        #gameOverOverlay p { font-size: 30px; margin-top: 10px; text-align: center; }

        @media (max-width: 768px) {
            #ui { top: 10px; }
            #question { font-size: 30px; padding: 10px 25px; border-width: 3px; margin-top: 60px; }
            #scoreBox { font-size: 18px; padding: 8px 15px; left: 10px; top: 10px; }
            #coinBox { font-size: 18px; padding: 8px 15px; right: 10px; top: 10px; }
            #startScreen h1 { font-size: 45px; }
            #startScreen p { font-size: 18px; }
            .coin-display { font-size: 22px; }
            #playButton { font-size: 26px; padding: 12px 40px; }
            #gameOverOverlay h1 { font-size: 50px; }
            #gameOverOverlay p { font-size: 20px; }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="startScreen">
        <h1>ගණිත ධාවකයා</h1>
        <p>ගිනි කඳු ලෝකයේ චක්කරය පුහුණු වෙමු!</p>
        <div class="coin-display">💰 ඔබ සතු කාසි: <span id="startSavedCoins">0</span></div>
        <button id="playButton">▶ ක්‍රීඩා කරන්න</button>
        <p style="font-size: 16px; margin-top: 20px;">මාරු වීමට ↔ Swipe කරන්න | පනින්න ↕ Swipe Up</p>
    </div>

    <div id="ui">
        <div id="scoreBox">ලකුණු: <span id="score">0</span></div>
        <div id="coinBox">💰 <span id="gameSavedCoins">0</span></div>
        <div id="question">? x ? =</div>
    </div>
    
    <div id="gameOverOverlay">
        <h1 id="gameOverText">වැරදියි!</h1>
        <p>නැවත ආරම්භ වෙමින් පවතී...</p>
    </div>

    <script>
        // --- Storage (කාසි සුරැකීම) ---
        let totalSavedCoins = parseInt(localStorage.getItem('mathRunnerCoins')) || 0;
        document.getElementById('startSavedCoins').innerText = totalSavedCoins;
        document.getElementById('gameSavedCoins').innerText = totalSavedCoins;

        // --- ශබ්ද ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, type, duration, vol=0.1) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(vol, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gainNode); gainNode.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }
        function playCoinSound() { playTone(987.77, 'sine', 0.1, 0.15); setTimeout(() => playTone(1318.51, 'sine', 0.2, 0.15), 50); }
        function playCorrectSound() { playTone(523.25, 'sine', 0.1, 0.2); setTimeout(() => playTone(659.25, 'sine', 0.1, 0.2), 100); setTimeout(() => playTone(783.99, 'sine', 0.3, 0.2), 200); }
        function playWrongSound() { playTone(200, 'sawtooth', 0.3, 0.3); setTimeout(() => playTone(150, 'sawtooth', 0.4, 0.3), 150); setTimeout(() => playTone(100, 'sawtooth', 0.5, 0.3), 300); }
        function playJumpSound() { playTone(400, 'sine', 0.2, 0.1); setTimeout(() => playTone(600, 'sine', 0.2, 0.1), 50); }
        function playShieldBreakSound() { playTone(300, 'square', 0.1, 0.3); setTimeout(() => playTone(150, 'square', 0.3, 0.3), 50); }
        function playPowerupSound() { playTone(600, 'sine', 0.1, 0.2); setTimeout(() => playTone(800, 'sine', 0.1, 0.2), 100); setTimeout(() => playTone(1000, 'sine', 0.2, 0.2), 200); }

        // --- 1. මූලික පරිසරය ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x2E0000); 
        scene.fog = new THREE.Fog(0x2E0000, 30, 100); 
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
        camera.position.set(0, 7, 14); camera.lookAt(0, 2, -10);
        const renderer = new THREE.WebGLRenderer({ antialias: false }); 
        renderer.setPixelRatio(window.devicePixelRatio > 1.5 ? 1.5 : window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffaaaa, 0.4); scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xff5500, 1.5); dirLight.position.set(-10, 20, 10); scene.add(dirLight);

        const groundGeo = new THREE.PlaneGeometry(200, 200);
        const groundMat = new THREE.MeshLambertMaterial({ color: 0x1a1a1a }); 
        const ground = new THREE.Mesh(groundGeo, groundMat); ground.rotation.x = -Math.PI / 2; scene.add(ground);

        const pathGeo = new THREE.PlaneGeometry(15, 200);
        const pathMat = new THREE.MeshLambertMaterial({ color: 0xff3300, emissive: 0x880000 }); 
        const path = new THREE.Mesh(pathGeo, pathMat); path.rotation.x = -Math.PI / 2; path.position.y = 0.05; scene.add(path);

        const sceneryObjects = [];
        function createRock(x, z) {
            const rockGeo = new THREE.DodecahedronGeometry(Math.random() * 2 + 1.5);
            const rockMat = new THREE.MeshLambertMaterial({ color: 0x222222, roughness: 0.9 });
            const rock = new THREE.Mesh(rockGeo, rockMat);
            rock.position.set(x, 1, z); rock.rotation.set(Math.random(), Math.random(), Math.random());
            scene.add(rock); sceneryObjects.push(rock);
        }
        function createLavaCrystal(x, z) {
            const crysGeo = new THREE.OctahedronGeometry(1.2);
            const crysMat = new THREE.MeshLambertMaterial({ color: 0xffaa00, emissive: 0xff3300 });
            const crystal = new THREE.Mesh(crysGeo, crysMat);
            crystal.position.set(x, 1.5, z); crystal.rotation.set(Math.random(), Math.random(), Math.random());
            scene.add(crystal); sceneryObjects.push(crystal);
        }
        for (let z = 20; z > -150; z -= 15) {
            if (Math.random() > 0.3) createRock(-10 - Math.random() * 10, z); else createLavaCrystal(-9 - Math.random() * 5, z);
            if (Math.random() > 0.3) createRock(10 + Math.random() * 10, z); else createLavaCrystal(9 + Math.random() * 5, z);
        }

        // --- 4. රොබෝ සහ පළිහ (Shield) ---
        const playerGroup = new THREE.Group();
        const bodyMat = new THREE.MeshLambertMaterial({ color: 0xeeeeee }); 
        const limbMat = new THREE.MeshLambertMaterial({ color: 0x888888 }); 

        const head = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), bodyMat); head.position.y = 2.5; playerGroup.add(head);
        const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 }); 
        const leftEye = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.1), eyeMat); leftEye.position.set(-0.25, 2.6, -0.55); playerGroup.add(leftEye);
        const rightEye = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.1), eyeMat); rightEye.position.set(0.25, 2.6, -0.55); playerGroup.add(rightEye);
        const body = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.5, 0.8), limbMat); body.position.y = 1.25; playerGroup.add(body);

        const createLimb = (x, y, z) => {
            const pivot = new THREE.Group(); pivot.position.set(x, y, z);
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.2, 0.4), bodyMat); mesh.position.y = -0.6; 
            pivot.add(mesh); playerGroup.add(pivot); return pivot;
        };
        const leftArm = createLimb(-0.9, 1.8, 0); const rightArm = createLimb(0.9, 1.8, 0);
        const leftLeg = createLimb(-0.35, 1.2, 0); const rightLeg = createLimb(0.35, 1.2, 0);

        playerGroup.position.set(0, 0, 3); scene.add(playerGroup);

        // පළිහේ (Shield) පෙනුම
        const shieldGeo = new THREE.SphereGeometry(2.2, 16, 16);
        const shieldMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.4, wireframe: true });
        const shieldMesh = new THREE.Mesh(shieldGeo, shieldMat);
        shieldMesh.position.y = 1.5;

        // --- 5. ක්‍රීඩාවේ විචල්‍යයන් ---
        let score = 0;
        let baseSpeed = 0.35; let speed = baseSpeed; 
        let isGameOver = false; let gameStarted = false; 
        let doors = []; let coins = []; let obstacles = []; let shields = [];
        let currentAnswer = 0; let playerLane = 0; const laneWidth = 4.5; 
        
        // පැනීමේ විචල්‍යයන් (Jump Variables)
        let isJumping = false;
        let yVelocity = 0;
        const gravity = -0.025; // ගුරුත්වාකර්ෂණය
        let hasShield = false; // රොබෝට පළිහක් තිබේද?

        document.getElementById('playButton').addEventListener('click', () => {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            document.getElementById('startScreen').style.display = 'none'; 
            document.getElementById('ui').style.display = 'block'; 
            generateQuestionAndDoors(); gameStarted = true; 
        });

        function saveCoin() {
            totalSavedCoins++;
            localStorage.setItem('mathRunnerCoins', totalSavedCoins);
            document.getElementById('gameSavedCoins').innerText = totalSavedCoins;
        }

        function spawnItems() {
            let zPos = -20; 
            for (let i = 0; i < 4; i++) {
                const lane = Math.floor(Math.random() * 3) - 1; 
                const rand = Math.random();

                if (rand > 0.85) { // 15% ක අවස්ථාවක් බාධකයක් (Obstacle) සෑදීමට
                    const obsGeo = new THREE.BoxGeometry(3, 1.2, 1.5);
                    const obsMat = new THREE.MeshLambertMaterial({ color: 0x222222 });
                    const obs = new THREE.Mesh(obsGeo, obsMat);
                    obs.position.set(lane * laneWidth, 0.6, zPos); 
                    scene.add(obs); obstacles.push(obs);
                } else if (rand > 0.75 && !hasShield) { // 10% ක අවස්ථාවක් පළිහක් සෑදීමට
                    const sGeo = new THREE.OctahedronGeometry(0.8);
                    const sMat = new THREE.MeshLambertMaterial({ color: 0x00ffff, emissive: 0x0055ff });
                    const shieldItem = new THREE.Mesh(sGeo, sMat);
                    shieldItem.position.set(lane * laneWidth, 1.5, zPos);
                    scene.add(shieldItem); shields.push(shieldItem);
                } else { // නැතිනම් කාසියක්
                    const coinGeo = new THREE.CylinderGeometry(0.6, 0.6, 0.15, 16); coinGeo.rotateX(Math.PI / 2); 
                    const coinMat = new THREE.MeshStandardMaterial({ color: 0xFFD700, metalness: 0.9, roughness: 0.1 });
                    const coin = new THREE.Mesh(coinGeo, coinMat);
                    coin.position.set(lane * laneWidth, 1.5, zPos); 
                    scene.add(coin); coins.push(coin);
                }
                zPos -= 12; 
            }
        }

        function createDoorTexture(text) {
            const canvas = document.createElement('canvas'); canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'rgba(150, 20, 0, 0.7)'; ctx.fillRect(0, 0, 256, 256);
            ctx.strokeStyle = '#FF6600'; ctx.lineWidth = 15; ctx.strokeRect(0, 0, 256, 256); 
            ctx.font = 'bold 110px Arial'; ctx.fillStyle = '#FFFFFF';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, 128, 128);
            return new THREE.CanvasTexture(canvas);
        }

        function generateQuestionAndDoors() {
            const num1 = Math.floor(Math.random() * 8) + 2; const num2 = Math.floor(Math.random() * 8) + 2;
            currentAnswer = num1 * num2;
            const qElement = document.getElementById('question'); qElement.innerText = `${num1} x ${num2} = ?`;
            
            let answers = [currentAnswer];
            while(answers.length < 3) {
                let wrong = currentAnswer + (Math.floor(Math.random() * 20) - 10);
                if (wrong !== currentAnswer && wrong > 0 && !answers.includes(wrong)) answers.push(wrong);
            }
            answers.sort(() => Math.random() - 0.5); 

            const lanes = [-1, 0, 1];
            for(let i = 0; i < 3; i++) {
                const texture = createDoorTexture(answers[i].toString());
                const material = new THREE.MeshBasicMaterial({ map: texture, transparent: true, side: THREE.DoubleSide });
                const door = new THREE.Mesh(new THREE.PlaneGeometry(4, 5), material);
                door.position.set(lanes[i] * laneWidth, 2.5, -80); door.userData = { isCorrect: answers[i] === currentAnswer };
                scene.add(door); doors.push(door);
            }
            spawnItems(); 
        }

        // --- පැනීමේ ක්‍රියාවලිය (Jump Logic) ---
        function jump() {
            if (!isJumping) {
                isJumping = true;
                yVelocity = 0.55; // පනින උස
                playJumpSound();
            }
        }

        window.addEventListener('keydown', (e) => {
            if (isGameOver || !gameStarted) return; 
            if ((e.key === 'ArrowLeft' || e.key === 'a') && playerLane > -1) playerLane--;
            if ((e.key === 'ArrowRight' || e.key === 'd') && playerLane < 1) playerLane++;
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') jump();
        });

        let touchStartX = 0; let touchStartY = 0;
        window.addEventListener('touchstart', e => { 
            touchStartX = e.changedTouches[0].screenX; 
            touchStartY = e.changedTouches[0].screenY; 
        }, {passive: false});
        window.addEventListener('touchmove', e => { e.preventDefault(); }, {passive: false});
        window.addEventListener('touchend', e => {
            if (isGameOver || !gameStarted) return;
            let touchEndX = e.changedTouches[0].screenX;
            let touchEndY = e.changedTouches[0].screenY;
            
            let diffX = touchEndX - touchStartX;
            let diffY = touchEndY - touchStartY;

            // උඩට Swipe කළහොත් පනින්න
            if (Math.abs(diffY) > Math.abs(diffX) && diffY < -40) {
                jump();
            } else {
                if (diffX < -40 && playerLane > -1) playerLane--;
                if (diffX > 40 && playerLane < 1) playerLane++;
            }
        });

        function clearAllItems() {
            doors.forEach(d => scene.remove(d)); doors = [];
            coins.forEach(c => scene.remove(c)); coins = [];
            obstacles.forEach(o => scene.remove(o)); obstacles = [];
            shields.forEach(s => scene.remove(s)); shields = [];
        }

        function resetGame() {
            score = 0; speed = baseSpeed; document.getElementById('score').innerText = score;
            clearAllItems();
            playerLane = 0; playerGroup.position.x = 0; playerGroup.position.y = 0;
            isJumping = false; yVelocity = 0;
            if(hasShield) { playerGroup.remove(shieldMesh); hasShield = false; }
            document.getElementById('gameOverOverlay').style.display = 'none';
            generateQuestionAndDoors(); isGameOver = false;
        }

        function handleWrongAnswerOrObstacle(reasonText) {
            if (hasShield) {
                // පළිහ තිබේනම් බේරේ
                hasShield = false;
                playerGroup.remove(shieldMesh);
                playShieldBreakSound();
            } else {
                // පළිහක් නැත්නම් Game Over
                playWrongSound(); 
                isGameOver = true;
                document.getElementById('gameOverText').innerText = reasonText;
                document.getElementById('gameOverOverlay').style.display = 'flex';
                setTimeout(resetGame, 2000); 
            }
        }

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            if (isGameOver) return; 

            const delta = clock.getDelta(); const time = clock.getElapsedTime();
            const speedMultiplier = Math.min(delta * 60, 3); 
            const currentSpeed = speed * speedMultiplier;

            // පැනීමේ සහ දිවීමේ Animation
            if (isJumping) {
                playerGroup.position.y += yVelocity * speedMultiplier;
                yVelocity += gravity * speedMultiplier;
                
                // කකුල් අත් සෙලවීම නතර කිරීම (පනිද්දී)
                leftArm.rotation.x = -Math.PI/4; rightArm.rotation.x = Math.PI/4;
                leftLeg.rotation.x = Math.PI/4; rightLeg.rotation.x = -Math.PI/6;

                if (playerGroup.position.y <= 0) { // බිමට වැටීම
                    playerGroup.position.y = 0;
                    isJumping = false; yVelocity = 0;
                }
            } else {
                const runSpeed = 18; 
                leftArm.rotation.x = Math.sin(time * runSpeed) * 0.8;
                rightArm.rotation.x = -Math.sin(time * runSpeed) * 0.8;
                leftLeg.rotation.x = -Math.sin(time * runSpeed) * 0.8;
                rightLeg.rotation.x = Math.sin(time * runSpeed) * 0.8;
                playerGroup.position.y = Math.abs(Math.sin(time * runSpeed * 2)) * 0.2; 
            }

            if (hasShield) shieldMesh.rotation.y += 0.05; // පළිහ කැරකීම

            renderer.render(scene, camera);
            if (!gameStarted) return;

            const targetX = playerLane * laneWidth;
            playerGroup.position.x += (targetX - playerGroup.position.x) * 0.2 * speedMultiplier;
            playerGroup.rotation.z = (playerGroup.position.x - targetX) * 0.05; 

            sceneryObjects.forEach(obj => {
                obj.position.z += currentSpeed;
                if (obj.position.z > 15) { obj.position.z -= 160; obj.rotation.set(Math.random(), Math.random(), Math.random()); }
            });

            // 1. කාසි (Coins)
            for (let i = coins.length - 1; i >= 0; i--) {
                let coin = coins[i]; coin.position.z += currentSpeed; coin.rotation.y += 0.08 * speedMultiplier; 
                if (Math.abs(coin.position.z - playerGroup.position.z) < 1.0 && Math.abs(coin.position.x - playerGroup.position.x) < 1.5 && playerGroup.position.y < 2) {
                    playCoinSound(); saveCoin(); // කාසි Save වීම
                    score += 2; document.getElementById('score').innerText = score;
                    scene.remove(coin); coins.splice(i, 1); continue;
                }
                if (coin.position.z > camera.position.z + 5) { scene.remove(coin); coins.splice(i, 1); }
            }

            // 2. පළිහ පවර්-අප් (Shield Power-up)
            for (let i = shields.length - 1; i >= 0; i--) {
                let s = shields[i]; s.position.z += currentSpeed; s.rotation.y += 0.1;
                if (Math.abs(s.position.z - playerGroup.position.z) < 1.0 && Math.abs(s.position.x - playerGroup.position.x) < 1.5 && playerGroup.position.y < 2) {
                    playPowerupSound(); 
                    if(!hasShield) { hasShield = true; playerGroup.add(shieldMesh); }
                    scene.remove(s); shields.splice(i, 1); continue;
                }
                if (s.position.z > camera.position.z + 5) { scene.remove(s); shields.splice(i, 1); }
            }

            // 3. බාධක (Obstacles - ලාවා ගල්)
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i]; obs.position.z += currentSpeed;
                // රොබෝ උඩින් පැන්නෙ නැත්නම් හැපේ (y < 1.5)
                if (Math.abs(obs.position.z - playerGroup.position.z) < 1.0 && Math.abs(obs.position.x - playerGroup.position.x) < 1.5) {
                    if (playerGroup.position.y < 1.2) { 
                        scene.remove(obs); obstacles.splice(i, 1);
                        handleWrongAnswerOrObstacle("බාධකයේ හැපුණා!");
                    }
                }
                if (obs.position.z > camera.position.z + 5) { scene.remove(obs); obstacles.splice(i, 1); }
            }

            // 4. දොරටු (Doors)
            for (let i = doors.length - 1; i >= 0; i--) {
                let door = doors[i]; door.position.z += currentSpeed;
                if (door.position.z > playerGroup.position.z - 0.5 && door.position.z < playerGroup.position.z + 0.5) {
                    if (Math.abs(door.position.x - playerGroup.position.x) < 2.0) {
                        if (door.userData.isCorrect) {
                            playCorrectSound(); score += 10; speed += 0.005; document.getElementById('score').innerText = score;
                            clearAllItems(); generateQuestionAndDoors(); break; 
                        } else {
                            scene.remove(door); doors.splice(i, 1); // දොර කඩාගෙන යාම
                            handleWrongAnswerOrObstacle("වැරදි පිළිතුරක්!");
                        }
                    }
                }
                if (door.position.z > camera.position.z + 5) {
                    scene.remove(door); doors.splice(i, 1);
                    if (doors.length === 0) { clearAllItems(); generateQuestionAndDoors(); }
                }
            }
        }
        
        animate();
        window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
    </script>
</body>
</html>
