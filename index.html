<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ගණිත ධාවකයා - මැජික් වනාන්තරය</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; touch-action: none; }
        
        #ui { position: absolute; top: 20px; width: 100%; text-align: center; pointer-events: none; z-index: 10; display: none; }
        #question { 
            font-size: 45px; font-weight: bold; color: #fff; 
            background: rgba(0, 0, 0, 0.8); padding: 15px 40px; 
            border-radius: 20px; display: inline-block; 
            border: 4px solid #FFD700; box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            transition: transform 0.2s;
        }
        #scoreBox { 
            position: absolute; top: 20px; left: 30px; 
            font-size: 30px; font-weight: bold; color: #FFD700; 
            background: rgba(0,0,0,0.8); padding: 10px 25px; 
            border-radius: 15px; border: 2px solid #FFD700;
            transition: transform 0.1s;
        }
        #instructions { 
            position: absolute; bottom: 20px; width: 100%; 
            text-align: center; color: #fff; font-size: 22px; 
            font-weight: bold; text-shadow: 2px 2px 4px #000; pointer-events: none; display: none;
        }

        #startScreen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(92, 179, 255, 0.95), rgba(76, 175, 80, 0.95));
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: white; z-index: 30;
        }
        #startScreen h1 { font-size: 65px; margin: 0; text-shadow: 3px 3px 6px #000; text-align: center; }
        #startScreen p { font-size: 24px; margin: 10px 0 30px 0; text-shadow: 2px 2px 4px #000; text-align: center; }
        #playButton {
            padding: 15px 50px; font-size: 32px; font-weight: bold;
            color: #fff; background-color: #FF9800; border: 3px solid #FFF; border-radius: 40px;
            cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.4); transition: transform 0.2s, background-color 0.2s;
        }
        #playButton:hover { transform: scale(1.1); background-color: #FFB74D; }

        #gameOverOverlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(200, 0, 0, 0.9); display: none;
            flex-direction: column; justify-content: center; align-items: center;
            color: white; z-index: 20;
        }
        #gameOverOverlay h1 { font-size: 80px; margin: 0; text-shadow: 3px 3px 6px #000; text-align: center; }
        #gameOverOverlay p { font-size: 30px; margin-top: 10px; text-align: center; }

        @media (max-width: 768px) {
            #ui { top: 10px; }
            #question { font-size: 32px; padding: 10px 25px; border-width: 3px; margin-top: 55px; }
            #scoreBox { font-size: 22px; padding: 8px 15px; left: 10px; top: 10px; }
            #instructions { font-size: 16px; bottom: 30px; }
            #startScreen h1 { font-size: 45px; }
            #startScreen p { font-size: 18px; }
            #playButton { font-size: 26px; padding: 12px 40px; }
            #gameOverOverlay h1 { font-size: 50px; }
            #gameOverOverlay p { font-size: 20px; }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="startScreen">
        <h1>ගණිත ධාවකයා</h1>
        <p>මැජික් වනාන්තරයේ චක්කරය පුහුණු වෙමු!</p>
        <button id="playButton">▶ ක්‍රීඩා කරන්න</button>
        <p style="font-size: 16px; margin-top: 20px;">මංතීරුව මාරු කිරීමට Swipe කරන්න (හෝ ← → Keys)</p>
    </div>

    <div id="ui">
        <div id="scoreBox">ලකුණු: <span id="score">0</span></div>
        <div id="question">? x ? =</div>
    </div>
    <div id="instructions">මංතීරුව මාරු කිරීමට Swipe කරන්න (හෝ ← → Keys)</div>
    
    <div id="gameOverOverlay">
        <h1>වැරදියි!</h1>
        <p>නැවත ආරම්භ වෙමින් පවතී...</p>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playTone(freq, type, duration, vol=0.1) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            
            gainNode.gain.setValueAtTime(vol, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playCoinSound() {
            playTone(987.77, 'sine', 0.1, 0.15); 
            setTimeout(() => playTone(1318.51, 'sine', 0.2, 0.15), 50); 
        }

        function playCorrectSound() {
            playTone(523.25, 'sine', 0.1, 0.2); 
            setTimeout(() => playTone(659.25, 'sine', 0.1, 0.2), 100); 
            setTimeout(() => playTone(783.99, 'sine', 0.3, 0.2), 200); 
        }

        function playWrongSound() {
            playTone(300, 'sawtooth', 0.3, 0.2);
            setTimeout(() => playTone(250, 'sawtooth', 0.4, 0.2), 150);
            setTimeout(() => playTone(200, 'sawtooth', 0.5, 0.2), 300);
        }

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x5CB3FF); 
        scene.fog = new THREE.Fog(0x5CB3FF, 40, 120); 
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
        camera.position.set(0, 7, 14);
        camera.lookAt(0, 2, -10);

        const renderer = new THREE.WebGLRenderer({ antialias: false }); // ජංගම දුරකථන වේගවත් කිරීමට antialias ඉවත් කළා
        
        // දුරකථනයේ Pixel Ratio එකට ගැලපෙන ලෙස සැකසීම (Performance Optimization)
        const pixelRatio = window.devicePixelRatio > 1.5 ? 1.5 : window.devicePixelRatio;
        renderer.setPixelRatio(pixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffee, 1.2); 
        dirLight.position.set(-15, 30, 10);
        scene.add(dirLight);

        const groundGeo = new THREE.PlaneGeometry(200, 200);
        const groundMat = new THREE.MeshLambertMaterial({ color: 0x4CAF50 }); 
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = 0;
        scene.add(ground);

        const pathGeo = new THREE.PlaneGeometry(15, 200);
        const pathMat = new THREE.MeshLambertMaterial({ color: 0x8D6E63 }); 
        const path = new THREE.Mesh(pathGeo, pathMat);
        path.rotation.x = -Math.PI / 2;
        path.position.y = 0.05;
        scene.add(path);

        const sceneryObjects = [];

        function createTree(x, z) {
            const tree = new THREE.Group();
            const trunkGeo = new THREE.CylinderGeometry(0.5, 0.7, 3, 8);
            const trunkMat = new THREE.MeshLambertMaterial({ color: 0x5D4037 });
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.y = 1.5;
            tree.add(trunk);

            const leavesGeo = new THREE.BoxGeometry(3, 3, 3);
            const leavesMat = new THREE.MeshLambertMaterial({ color: 0x2E7D32 });
            const leaves = new THREE.Mesh(leavesGeo, leavesMat);
            leaves.position.y = 4;
            leaves.rotation.x = Math.random() * 0.5;
            leaves.rotation.y = Math.random() * 0.5;
            tree.add(leaves);

            tree.position.set(x, 0, z);
            scene.add(tree);
            sceneryObjects.push(tree);
        }

        function createMushroom(x, z) {
            const mushroom = new THREE.Group();
            const stemGeo = new THREE.CylinderGeometry(0.3, 0.4, 2, 8);
            const stemMat = new THREE.MeshLambertMaterial({ color: 0xFFFAFA });
            const stem = new THREE.Mesh(stemGeo, stemMat);
            stem.position.y = 1;
            mushroom.add(stem);

            const capGeo = new THREE.SphereGeometry(1.5, 12, 12, 0, Math.PI * 2, 0, Math.PI / 2);
            const color = Math.random() > 0.5 ? 0xE53935 : 0xFFCA28; 
            const capMat = new THREE.MeshLambertMaterial({ color: color });
            const cap = new THREE.Mesh(capGeo, capMat);
            cap.position.y = 2;
            mushroom.add(cap);

            mushroom.position.set(x, 0, z);
            scene.add(mushroom);
            sceneryObjects.push(mushroom);
        }

        for (let z = 20; z > -150; z -= 15) {
            if (Math.random() > 0.4) createTree(-10 - Math.random() * 10, z);
            else createMushroom(-9 - Math.random() * 5, z);
            if (Math.random() > 0.4) createTree(10 + Math.random() * 10, z);
            else createMushroom(9 + Math.random() * 5, z);
        }

        const playerGroup = new THREE.Group();
        const bodyMat = new THREE.MeshLambertMaterial({ color: 0xff4400 }); 
        const limbMat = new THREE.MeshLambertMaterial({ color: 0xdddddd }); 

        const head = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), bodyMat);
        head.position.y = 2.5;
        playerGroup.add(head);

        const eyeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
        const leftEye = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.1), eyeMat);
        leftEye.position.set(-0.25, 2.6, -0.55);
        playerGroup.add(leftEye);
        const rightEye = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.1), eyeMat);
        rightEye.position.set(0.25, 2.6, -0.55);
        playerGroup.add(rightEye);

        const body = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.5, 0.8), limbMat);
        body.position.y = 1.25;
        playerGroup.add(body);

        const createLimb = (x, y, z) => {
            const pivot = new THREE.Group();
            pivot.position.set(x, y, z);
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.2, 0.4), bodyMat);
            mesh.position.y = -0.6; 
            pivot.add(mesh);
            playerGroup.add(pivot);
            return pivot;
        };

        const leftArm = createLimb(-0.9, 1.8, 0);
        const rightArm = createLimb(0.9, 1.8, 0);
        const leftLeg = createLimb(-0.35, 1.2, 0);
        const rightLeg = createLimb(0.35, 1.2, 0);

        playerGroup.position.set(0, 0, 3);
        scene.add(playerGroup);

        let score = 0;
        let baseSpeed = 0.35; 
        let speed = baseSpeed; 
        let isGameOver = false;
        let gameStarted = false; 
        let doors = []; 
        let coins = []; 
        let currentAnswer = 0;
        let playerLane = 0; 
        const laneWidth = 4.5; 

        document.getElementById('playButton').addEventListener('click', () => {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            document.getElementById('startScreen').style.display = 'none'; 
            document.getElementById('ui').style.display = 'block'; 
            document.getElementById('instructions').style.display = 'block';
            
            generateQuestionAndDoors(); 
            gameStarted = true; 
            
            setTimeout(() => { document.getElementById('instructions').style.display = 'none'; }, 4000);
        });

        function updateScore(points) {
            score += points;
            const scoreBox = document.getElementById('scoreBox');
            document.getElementById('score').innerText = score;
            scoreBox.style.transform = 'scale(1.3)';
            setTimeout(() => { scoreBox.style.transform = 'scale(1)'; }, 100);
        }

        function spawnCoins() {
            let zPos = -20; 
            for (let i = 0; i < 5; i++) {
                const lane = Math.floor(Math.random() * 3) - 1; 
                const coinGeo = new THREE.CylinderGeometry(0.6, 0.6, 0.15, 16);
                coinGeo.rotateX(Math.PI / 2); 
                const coinMat = new THREE.MeshStandardMaterial({ color: 0xFFD700, metalness: 0.9, roughness: 0.1 });
                const coin = new THREE.Mesh(coinGeo, coinMat);
                coin.position.set(lane * laneWidth, 1.5, zPos); 
                scene.add(coin);
                coins.push(coin);
                zPos -= 10; 
            }
        }

        function createDoorTexture(text) {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = 'rgba(0, 50, 200, 0.6)'; 
            ctx.fillRect(0, 0, 256, 256);
            ctx.strokeStyle = '#00FFFF'; ctx.lineWidth = 15;
            ctx.strokeRect(0, 0, 256, 256); 
            
            ctx.font = 'bold 110px Arial';
            ctx.fillStyle = '#FFFFFF';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(text, 128, 128);
            return new THREE.CanvasTexture(canvas);
        }

        function generateQuestionAndDoors() {
            const num1 = Math.floor(Math.random() * 8) + 2; 
            const num2 = Math.floor(Math.random() * 8) + 2;
            currentAnswer = num1 * num2;
            
            const qElement = document.getElementById('question');
            qElement.innerText = `${num1} x ${num2} = ?`;
            qElement.style.transform = 'scale(1.1)';
            setTimeout(() => { qElement.style.transform = 'scale(1)'; }, 150);

            let answers = [currentAnswer];
            while(answers.length < 3) {
                let wrong = currentAnswer + (Math.floor(Math.random() * 20) - 10);
                if (wrong !== currentAnswer && wrong > 0 && !answers.includes(wrong)) {
                    answers.push(wrong);
                }
            }
            answers.sort(() => Math.random() - 0.5); 

            const lanes = [-1, 0, 1];
            for(let i = 0; i < 3; i++) {
                const texture = createDoorTexture(answers[i].toString());
                const material = new THREE.MeshBasicMaterial({ map: texture, transparent: true, side: THREE.DoubleSide });
                const geometry = new THREE.PlaneGeometry(4, 5); 
                const door = new THREE.Mesh(geometry, material);
                
                door.position.set(lanes[i] * laneWidth, 2.5, -80); 
                door.userData = { isCorrect: answers[i] === currentAnswer };
                scene.add(door);
                doors.push(door);
            }
            spawnCoins(); 
        }

        window.addEventListener('keydown', (e) => {
            if (isGameOver || !gameStarted) return; 
            if ((e.key === 'ArrowLeft' || e.key === 'a') && playerLane > -1) playerLane--;
            if ((e.key === 'ArrowRight' || e.key === 'd') && playerLane < 1) playerLane++;
        });

        let touchStartX = 0;
        let touchEndX = 0;

        window.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        }, {passive: false});

        window.addEventListener('touchmove', e => {
            e.preventDefault(); 
        }, {passive: false});

        window.addEventListener('touchend', e => {
            if (isGameOver || !gameStarted) return;
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        });

        function handleSwipe() {
            const swipeThreshold = 40; 
            if (touchEndX < touchStartX - swipeThreshold && playerLane > -1) playerLane--;
            if (touchEndX > touchStartX + swipeThreshold && playerLane < 1) playerLane++;
        }

        function resetGame() {
            score = 0;
            speed = baseSpeed;
            document.getElementById('score').innerText = score;
            
            doors.forEach(d => scene.remove(d));
            doors = [];
            coins.forEach(c => scene.remove(c)); 
            coins = [];
            
            playerLane = 0;
            playerGroup.position.x = 0;
            document.getElementById('gameOverOverlay').style.display = 'none';
            generateQuestionAndDoors();
            isGameOver = false;
        }

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            if (isGameOver) return; 

            // කාලය ගණනය කිරීම (Delta Time)
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();
            
            // Frame rate එක අනුව වේගය සමබර කිරීම සඳහා ගුණාකාරයක් (Multiplier)
            const speedMultiplier = Math.min(delta * 60, 3); // උපරිම ගුණාකාරය 3කට සීමා කර ඇත

            const runSpeed = 18; 
            leftArm.rotation.x = Math.sin(time * runSpeed) * 0.8;
            rightArm.rotation.x = -Math.sin(time * runSpeed) * 0.8;
            leftLeg.rotation.x = -Math.sin(time * runSpeed) * 0.8;
            rightLeg.rotation.x = Math.sin(time * runSpeed) * 0.8;
            playerGroup.position.y = Math.abs(Math.sin(time * runSpeed * 2)) * 0.2; 

            renderer.render(scene, camera);

            if (!gameStarted) return;

            const targetX = playerLane * laneWidth;
            // හැරෙන වේගයටත් Multiplier එක යෙදීම
            playerGroup.position.x += (targetX - playerGroup.position.x) * 0.2 * speedMultiplier;
            playerGroup.rotation.z = (playerGroup.position.x - targetX) * 0.05; 

            // පරිසරය පසුපසට යාම Delta time හරහා සමබර කිරීම
            const currentSpeed = speed * speedMultiplier;

            sceneryObjects.forEach(obj => {
                obj.position.z += currentSpeed;
                if (obj.position.z > 15) obj.position.z -= 160; 
            });

            for (let i = coins.length - 1; i >= 0; i--) {
                let coin = coins[i];
                coin.position.z += currentSpeed; 
                coin.rotation.y += 0.08 * speedMultiplier; 

                if (Math.abs(coin.position.z - playerGroup.position.z) < 1.0 && 
                    Math.abs(coin.position.x - playerGroup.position.x) < 1.5) {
                    playCoinSound(); 
                    updateScore(2); 
                    scene.remove(coin);
                    coins.splice(i, 1);
                    continue;
                }
                if (coin.position.z > camera.position.z + 5) {
                    scene.remove(coin);
                    coins.splice(i, 1);
                }
            }

            for (let i = doors.length - 1; i >= 0; i--) {
                let door = doors[i];
                door.position.z += currentSpeed;

                if (door.position.z > playerGroup.position.z - 0.5 && door.position.z < playerGroup.position.z + 0.5) {
                    if (Math.abs(door.position.x - playerGroup.position.x) < 2.0) {
                        if (door.userData.isCorrect) {
                            playCorrectSound(); 
                            updateScore(10); 
                            speed += 0.005; 
                            
                            doors.forEach(d => scene.remove(d));
                            doors = [];
                            coins.forEach(c => scene.remove(c));
                            coins = [];
                            generateQuestionAndDoors();
                            break; 
                        } else {
                            playWrongSound(); 
                            isGameOver = true;
                            document.getElementById('gameOverOverlay').style.display = 'flex';
                            setTimeout(resetGame, 2000); 
                            break;
                        }
                    }
                }
                if (door.position.z > camera.position.z + 5) {
                    scene.remove(door);
                    doors.splice(i, 1);
                    if (doors.length === 0) {
                        coins.forEach(c => scene.remove(c));
                        coins = [];
                        generateQuestionAndDoors(); 
                    }
                }
            }
        }
        
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
