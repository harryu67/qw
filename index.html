<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Educational Analog Clock</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 15px; /* කුඩා තිර වලදී වටේට ඉඩ තබාගැනීමට */
            box-sizing: border-box;
        }

        .clock-container {
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px; /* පරිගණක වලදී උපරිම පළල */
            box-sizing: border-box;
        }

        /* SVG ඔරලෝසුව තිරයට අනුව කුඩා/විශාල වීමට සැකසීම */
        svg {
            display: block;
            margin: 0 auto;
            width: 100%;
            height: auto;
        }

        .controls {
            margin-top: 25px;
            text-align: center;
            background: #ffffff;
            padding: 25px 20px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            border: 1px solid #eaeaea;
            width: 100%;
            max-width: 450px;
            box-sizing: border-box;
        }

        label {
            display: block;
            font-size: 18px;
            margin-bottom: 15px;
            font-weight: 600;
            color: #4b5563;
            letter-spacing: 0.5px;
        }

        input[type="time"] {
            font-size: 32px;
            padding: 12px 10px;
            border: 2px solid #d1d5db;
            border-radius: 10px;
            font-weight: bold;
            color: #1f2937;
            background-color: #f9fafb;
            outline: none;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Courier New', Courier, monospace;
            letter-spacing: 2px;
            width: 100%; /* බොත්තම කොටුව පුරා පැතිරීමට */
            box-sizing: border-box;
            text-align: center;
        }

        input[type="time"]:hover {
            border-color: #9ca3af;
        }

        input[type="time"]:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2);
            background-color: #ffffff;
        }

        /* ඉතා කුඩා තිර සඳහා අකුරු ප්‍රමාණය මදක් වෙනස් කිරීම */
        @media (max-width: 380px) {
            input[type="time"] {
                font-size: 26px;
            }
            .clock-container {
                padding: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="clock-container">
        <svg id="clock-svg" viewBox="0 0 400 400">
            <circle cx="200" cy="200" r="195" fill="white" stroke="black" stroke-width="6" />
            <circle cx="200" cy="200" r="182" fill="none" stroke="black" stroke-width="2.5" />

            <g id="ticks"></g>

            <g id="numbers"></g>

            <path id="angle-arc" fill="none" stroke="black" stroke-width="3" />

            <g id="hour-hand">
                <polygon points="192,200 192,120 183,120 200,85 217,120 208,120 208,200" fill="white" stroke="black" stroke-width="4" stroke-linejoin="round"/>
            </g>

            <g id="minute-hand">
                <polygon points="194,200 194,70 186,70 200,40 214,70 206,70 206,200" fill="white" stroke="black" stroke-width="3.5" stroke-linejoin="round"/>
            </g>

            <circle cx="200" cy="200" r="8" fill="white" stroke="black" stroke-width="4" />
        </svg>
    </div>

    <div class="controls">
        <label>වේලාව වෙනස් කරන්න 🕒</label>
        <input type="time" id="timePicker" value="04:10">
    </div>

    <script>
        const ticksGroup = document.getElementById('ticks');
        const numbersGroup = document.getElementById('numbers');
        const hourHand = document.getElementById('hour-hand');
        const minuteHand = document.getElementById('minute-hand');
        const angleArc = document.getElementById('angle-arc');
        const timePicker = document.getElementById('timePicker');

        function drawClockFace() {
            for (let i = 0; i < 60; i++) {
                let angle = i * 6;
                let isHour = i % 5 === 0;
                
                let rStart = 182; 
                let rEnd = isHour ? 155 : 170; 
                let strokeWidth = isHour ? 6 : 2.5; 

                let line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', '200');
                line.setAttribute('y1', 200 - rStart);
                line.setAttribute('x2', '200');
                line.setAttribute('y2', 200 - rEnd);
                line.setAttribute('stroke', 'black');
                line.setAttribute('stroke-width', strokeWidth);
                line.setAttribute('transform', `rotate(${angle} 200 200)`);
                ticksGroup.appendChild(line);

                if (isHour) {
                    let num = i === 0 ? 12 : i / 5;
                    let text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                    
                    let rad = (angle - 90) * Math.PI / 180;
                    let radius = 125; 
                    let x = 200 + radius * Math.cos(rad);
                    let y = 200 + radius * Math.sin(rad) + 16; 
                    
                    text.setAttribute('x', x);
                    text.setAttribute('y', y);
                    text.setAttribute('text-anchor', 'middle');
                    text.setAttribute('font-size', '44px');
                    text.setAttribute('font-weight', 'bold');
                    text.setAttribute('font-family', 'Arial, sans-serif');
                    text.textContent = num;
                    numbersGroup.appendChild(text);
                }
            }
        }

        function drawArc(hAngle, mAngle) {
            let startAngle = Math.min(hAngle, mAngle);
            let endAngle = Math.max(hAngle, mAngle);

            if (endAngle - startAngle > 180) {
                startAngle = Math.max(hAngle, mAngle);
                endAngle = Math.min(hAngle, mAngle) + 360;
            }

            let startRad = (startAngle - 90) * Math.PI / 180;
            let endRad = (endAngle - 90) * Math.PI / 180;

            let radius = 55; 
            let startX = 200 + radius * Math.cos(startRad);
            let startY = 200 + radius * Math.sin(startRad);
            let endX = 200 + radius * Math.cos(endRad);
            let endY = 200 + radius * Math.sin(endRad);

            let d = `M ${startX} ${startY} A ${radius} ${radius} 0 0 1 ${endX} ${endY}`;
            angleArc.setAttribute('d', d);
        }

        function setTime() {
            const timeValues = timePicker.value.split(':');
            let hours = parseInt(timeValues[0]);
            let minutes = parseInt(timeValues[1]);

            const minuteAngle = minutes * 6; 
            const hourAngle = (hours % 12) * 30 + (minutes * 0.5); 

            minuteHand.setAttribute('transform', `rotate(${minuteAngle} 200 200)`);
            hourHand.setAttribute('transform', `rotate(${hourAngle} 200 200)`);

            drawArc(hourAngle, minuteAngle);
        }

        timePicker.addEventListener('input', setTime);
        drawClockFace();
        setTime(); 

    </script>
</body>
</html>
